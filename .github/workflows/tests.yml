name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unittest discovery
        run: python -m unittest discover -s scripts/tests -t scripts -v

      - name: Smoke test bash wrappers (Linux/macOS + Git Bash for Windows)
        shell: bash
        run: |
          set -euo pipefail
          tmp_home=$(mktemp -d)
          HOME="$tmp_home" bash install.sh > install.log
          test ! -d "$tmp_home/.qwen"  # Qwen Code is opt-in
          HOME="$tmp_home" bash scripts/verify-install.sh
          HOME="$tmp_home" bash clean.sh > clean.log

      - name: Smoke test --qwen pass-through
        shell: bash
        run: |
          set -euo pipefail
          tmp_home=$(mktemp -d)
          HOME="$tmp_home" bash install.sh --qwen > install-qwen.log
          test -f "$tmp_home/.qwen/QWEN.md"
          test -d "$tmp_home/.qwen/skills"
          test -f "$tmp_home/.qwen/settings.json"
          HOME="$tmp_home" bash scripts/verify-install.sh --qwen
          HOME="$tmp_home" bash clean.sh --qwen > clean-qwen.log
          test -f "$tmp_home/.qwen/settings.json"  # user-managed keys survive clean

      - name: Smoke test --claude-dir pass-through
        shell: bash
        run: |
          set -euo pipefail
          tmp_home=$(mktemp -d)
          target="$tmp_home/.claude-sub"
          HOME="$tmp_home" bash install.sh --claude-dir "$target" > install-sub.log
          HOME="$tmp_home" bash scripts/verify-install.sh --claude-dir "$target"
          HOME="$tmp_home" bash clean.sh --claude-dir "$target" > clean-sub.log
          test ! -d "$tmp_home/.claude"  # the default destination stays untouched
