name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unittest discovery
        run: python -m unittest discover -v

      - name: Smoke test bash wrappers (POSIX shells + Git Bash for Windows)
        shell: bash
        run: |
          set -euo pipefail
          tmp_home=$(mktemp -d)
          HOME="$tmp_home" bash install.sh > install.log
          HOME="$tmp_home" bash scripts/verify-install.sh
          HOME="$tmp_home" bash clean.sh > clean.log
