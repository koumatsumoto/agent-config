version: 1
scenarios:
  - id: trigger-review-default
    title: Review request should prefer km:review as the default entry point
    prompt: "この変更レビューして"
    context:
      changed_files:
        - templates/skills/review/SKILL.md
        - templates/skills/code-review/SKILL.md
      conversation_context: true
    expected:
      primary_skill: km:review
      should_not_start_with:
        - km:code-review
        - km:quality-review
        - km:doc-review
      notes:
        - review subskills may be used as children after km:review decides routing
        - unspecified review requests default to the standard level

  - id: trigger-review-thorough
    title: Deep review request should still route through km:review
    prompt: "この変更を深くレビューして"
    context:
      changed_files:
        - templates/skills/review/SKILL.md
        - templates/skills/code-review/SKILL.md
      conversation_context: true
    expected:
      primary_skill: km:review
      should_not_start_with:
        - km:code-review
        - km:quality-review
        - km:doc-review
      notes:
        - deep review requests should select the thorough level within km:review

  - id: trigger-review-quick
    title: Quick review request should still route through km:review
    prompt: "この変更を浅くレビューして"
    context:
      changed_files:
        - templates/skills/review/SKILL.md
      conversation_context: true
    expected:
      primary_skill: km:review
      should_not_start_with:
        - km:code-review
        - km:quality-review
        - km:doc-review
      notes:
        - shallow review requests should select the quick level within km:review

  - id: trigger-commit-natural-language
    title: Natural language commit request should still trigger km:commit
    prompt: "この変更をコミットして"
    context:
      changed_files:
        - templates/skills/review/SKILL.md
      conversation_context: true
    expected:
      primary_skill: km:commit
      notes:
        - the user should not need to type /km:commit explicitly

  - id: trigger-github-workflow-natural-language
    title: Natural language PR request should still trigger km:github-workflow
    prompt: "この作業をPRまでやって"
    context:
      changed_files:
        - templates/skills/review/SKILL.md
        - README.md
      conversation_context: true
    expected:
      primary_skill: km:github-workflow
      notes:
        - branch creation or reuse may be part of the workflow

  - id: trigger-implementation-should-not-trigger-github-workflow
    title: Generic implementation request should NOT trigger km:github-workflow
    prompt: "この機能を実装して"
    context:
      changed_files: []
      conversation_context: true
    expected:
      should_not_trigger:
        - km:github-workflow
      notes:
        - generic implementation requests should go through normal coding flow
        - km:github-workflow requires explicit PR or delivery intent

  - id: trigger-code-review-should-route-through-orchestrator
    title: Natural language code review request should use km:review, not km:code-review
    prompt: "コードレビューして"
    context:
      changed_files:
        - src/api/users.ts
      conversation_context: true
    expected:
      primary_skill: km:review
      should_not_start_with:
        - km:code-review
        - km:quality-review
      notes:
        - km:code-review has disable-model-invocation so must route through orchestrator

  - id: trigger-quality-review-should-route-through-orchestrator
    title: Natural language quality review request should use km:review, not km:quality-review
    prompt: "品質レビューして"
    context:
      changed_files:
        - src/api/users.ts
      conversation_context: true
    expected:
      primary_skill: km:review
      should_not_start_with:
        - km:code-review
        - km:quality-review
      notes:
        - km:quality-review has disable-model-invocation so must route through orchestrator

  - id: trigger-third-party-oss-security-review-npm
    title: Explicit npm package intake review should trigger km:third-party-oss-security-review
    prompt: "npm パッケージ lodash@4.17.21 の採用前セキュリティレビューをして"
    context:
      changed_files: []
      conversation_context: true
    expected:
      primary_skill: km:third-party-oss-security-review
      should_not_start_with:
        - km:review
      notes:
        - this skill is specialized and manual-only

  - id: trigger-third-party-oss-security-review-pip
    title: Explicit pip package intake review should trigger km:third-party-oss-security-review
    prompt: "pip パッケージ requests==2.32.0 の採用可否を確認して"
    context:
      changed_files: []
      conversation_context: true
    expected:
      primary_skill: km:third-party-oss-security-review
      should_not_start_with:
        - km:review
      notes:
        - pip ecosystem must route through the single OSS intake skill

  - id: trigger-third-party-oss-security-review-vscode-extension
    title: VS Code extension intake review should trigger km:third-party-oss-security-review
    prompt: "VS Code 拡張 ms-python.python の採用前セキュリティレビューをして"
    context:
      changed_files: []
      conversation_context: true
    expected:
      primary_skill: km:third-party-oss-security-review
      should_not_start_with:
        - km:review
      notes:
        - vscode-extension ecosystem must route through the single OSS intake skill

  - id: trigger-third-party-oss-security-review-repo-url
    title: GitHub repository URL intake should trigger km:third-party-oss-security-review
    prompt: "https://github.com/example/tool を採用したいのでセキュリティレビューしてほしい"
    context:
      changed_files: []
      conversation_context: true
    expected:
      primary_skill: km:third-party-oss-security-review
      should_not_start_with:
        - km:review
      notes:
        - repo-url input should still enter the OSS intake skill and yield a repository-level preliminary assessment

  - id: trigger-generic-review-should-not-trigger-third-party-oss-security-review
    title: Generic review request should not trigger km:third-party-oss-security-review
    prompt: "この変更レビューして"
    context:
      changed_files:
        - src/api/users.ts
      conversation_context: true
    expected:
      primary_skill: km:review
      should_not_trigger:
        - km:third-party-oss-security-review
      notes:
        - OSS intake review should remain outside km:review routing
