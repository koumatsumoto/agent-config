version: 1
scenarios:
  - id: workflow-issue-ambiguous-candidates
    title: Multiple plausible open issues should stop for clarification
    prompt: "issue化してから PR にして"
    context:
      git_branch: main
      has_uncommitted_changes: false
      upstream_set: true
      github_repo: true
      matching_open_issues: 2
    expected:
      primary_skill: km:github-workflow
      required_behavior:
        - do not create a new issue when multiple candidates exist
        - ask the user which issue should be used

  - id: workflow-body-file-only
    title: GitHub body submission should use body-file only
    prompt: "issue化してから PR までやって"
    context:
      git_branch: feat/github-workflow-issue-pr-linkage
      has_uncommitted_changes: false
      upstream_set: true
      github_repo: true
      matching_open_issues: 0
    expected:
      primary_skill: km:github-workflow
      required_behavior:
        - use quoted heredoc with body-file for issue and PR content
        - avoid body string flags for issue and PR content

  - id: workflow-non-github-repo-stop
    title: Non-GitHub repositories should be treated as out of scope
    prompt: "この作業をPRまでやって"
    context:
      git_branch: main
      has_uncommitted_changes: false
      upstream_set: false
      github_repo: false
    expected:
      primary_skill: km:github-workflow
      required_behavior:
        - stop immediately when repository verification fails
        - do not attempt issue or PR operations
