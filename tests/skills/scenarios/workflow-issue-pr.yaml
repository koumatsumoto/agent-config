version: 1
scenarios:
  - id: workflow-issue-create-new
    title: Explicit issue request should create a new issue when no open candidate exists
    prompt: "この作業を issue 化してから PR までやって"
    context:
      git_branch: main
      has_uncommitted_changes: false
      upstream_set: true
      github_repo: true
      matching_open_issues: 0
    expected:
      primary_skill: km:github-workflow
      required_behavior:
        - verify the repository is GitHub-managed before proceeding
        - create a new issue before any PR step
        - use body-file based issue body submission
        - stop after issue creation when implementation is not ready
        - tell the user to resume with the created issue number

  - id: workflow-issue-reuse-open
    title: Explicit issue request should reuse one matching open issue
    prompt: "issue付きで PR まで進めて"
    context:
      git_branch: main
      has_uncommitted_changes: false
      upstream_set: true
      github_repo: true
      matching_open_issues: 1
    expected:
      primary_skill: km:github-workflow
      required_behavior:
        - reuse the existing open issue instead of creating a duplicate
        - stop after issue reuse when implementation is not ready
        - tell the user to resume with the selected issue number

  - id: workflow-issue-ambiguous-candidates
    title: Multiple plausible open issues should stop for clarification
    prompt: "issue化してから PR にして"
    context:
      git_branch: main
      has_uncommitted_changes: false
      upstream_set: true
      github_repo: true
      matching_open_issues: 2
    expected:
      primary_skill: km:github-workflow
      required_behavior:
        - do not create a new issue when multiple candidates exist
        - ask the user which issue should be used

  - id: workflow-existing-issue-argument
    title: Explicit issue-number argument should reuse that issue number directly
    prompt: "/km:github-workflow 21"
    context:
      git_branch: feat/github-workflow-issue-pr-linkage
      has_uncommitted_changes: true
      upstream_set: false
      github_repo: true
      issue_number_argument: 21
      target_issue_open: true
    expected:
      primary_skill: km:github-workflow
      required_behavior:
        - reuse the specified issue number
        - do not search for or create another issue

  - id: workflow-pr-closes-issue
    title: Linked single-issue PR should include Closes syntax
    prompt: "issue付きでこの作業をPRにして"
    context:
      git_branch: feat/github-workflow-issue-pr-linkage
      has_uncommitted_changes: false
      has_unpushed_commits: true
      upstream_set: true
      github_repo: true
      matching_open_issues: 1
    expected:
      primary_skill: km:github-workflow
      required_behavior:
        - include a standalone Closes issue line in the PR body

  - id: workflow-body-file-only
    title: GitHub body submission should use body-file only
    prompt: "issue化してから PR までやって"
    context:
      git_branch: feat/github-workflow-issue-pr-linkage
      has_uncommitted_changes: false
      upstream_set: true
      github_repo: true
      matching_open_issues: 0
    expected:
      primary_skill: km:github-workflow
      required_behavior:
        - use quoted heredoc with body-file for issue and PR content
        - avoid body string flags for issue and PR content

  - id: workflow-non-github-repo-stop
    title: Non-GitHub repositories should be treated as out of scope
    prompt: "この作業をPRまでやって"
    context:
      git_branch: main
      has_uncommitted_changes: false
      upstream_set: false
      github_repo: false
    expected:
      primary_skill: km:github-workflow
      required_behavior:
        - stop immediately when repository verification fails
        - do not attempt issue or PR operations

  - id: workflow-existing-pr-keeps-issue-link
    title: Existing PR reuse should preserve linked issue conventions
    prompt: "issue付きでこのブランチをPRまで更新して"
    context:
      git_branch: feat/github-workflow-issue-pr-linkage
      has_uncommitted_changes: false
      has_unpushed_commits: false
      upstream_set: true
      existing_pr: true
      github_repo: true
      matching_open_issues: 1
    expected:
      primary_skill: km:github-workflow
      required_behavior:
        - reuse the existing PR instead of creating a duplicate
        - update the PR body without dropping the issue linkage

  - id: workflow-explicit-base-branch
    title: Explicit base branch should be used when creating a work branch
    prompt: "develop からブランチを切って issue 化してから PR までやって"
    context:
      git_branch: develop
      has_uncommitted_changes: false
      upstream_set: true
      github_repo: true
      matching_open_issues: 0
      explicit_base_branch: develop
    expected:
      primary_skill: km:github-workflow
      required_behavior:
        - use the explicitly requested base branch before creating the work branch
        - avoid defaulting to main when an explicit base branch exists

  - id: workflow-default-base-main
    title: Unspecified base branch should default to main when it is available
    prompt: "この作業をPRまでやって"
    context:
      git_branch: main
      has_uncommitted_changes: false
      upstream_set: true
      github_repo: true
      repo_has_main: true
      repo_has_master: true
    expected:
      primary_skill: km:github-workflow
      required_behavior:
        - choose main as the default base branch when no explicit base branch is given

  - id: workflow-issue-ssot-comments
    title: Issue-backed planning should be maintained only until a PR exists
    prompt: "issue化してから PR までやって"
    context:
      git_branch: main
      has_uncommitted_changes: false
      upstream_set: true
      github_repo: true
      matching_open_issues: 0
      issue_is_plan_ssot: true
    expected:
      primary_skill: km:github-workflow
      required_behavior:
        - keep a newly created issue body aligned with the latest plan before a PR exists
        - stop maintaining issue details after the PR becomes the implementation record
