version: 1
scenarios:
  - id: review-quality-blocking
    title: High-severity finding should block commit
    prompt: "レビューして"
    context:
      changed_files:
        - src/api/users.ts
      injected_issue: "unvalidated external input reaches SQL query"
      change_type: feat
      conversation_context: true
    expected:
      primary_skill: km:review
      required_output:
        - severity summary
        - blocking decision
      expected_blocking: BLOCKED
      minimum_findings:
        - severity: HIGH
          area: security_or_quality

  - id: review-quality-doc-update-check
    title: Code-only public API change should recommend docs update
    prompt: "レビューして"
    context:
      changed_files:
        - src/api/routes.ts
        - src/api/schema.ts
      change_type: feat
      conversation_context: true
      public_interface_changed: true
    expected:
      primary_skill: km:review
      required_output:
        - doc update recommendation
      notes:
        - full doc-review is not required, but update necessity must be surfaced

  - id: review-quality-expert-severity-format
    title: Expert review findings must use severity format and participate in blocking
    prompt: "深くレビューして"
    context:
      changed_files:
        - src/api/auth.ts
        - src/lib/session.ts
      injected_issue: "session token stored in localStorage without encryption"
      change_type: feat
      conversation_context: true
    expected:
      primary_skill: km:review
      required_output:
        - expert review section with severity summary per expert
        - individual expert findings with severity, location, and confidence
        - expert HIGH/CRITICAL reflected in integrated blocking decision
      expected_blocking: BLOCKED
      notes:
        - expert findings must use the same CRITICAL/HIGH/MEDIUM/LOW format as code-review and quality-review
        - expert severity counts must be included in the integrated summary totals

  - id: review-quality-evaluation-summary
    title: Quality evaluation summary with 9 characteristics must be present
    prompt: "レビューして"
    context:
      changed_files:
        - src/api/users.ts
        - src/lib/validation.ts
      change_type: feat
      conversation_context: true
    expected:
      primary_skill: km:review
      required_output:
        - quality evaluation summary table with 9 characteristics
        - each characteristic rated as PASS, WARN, FAIL, or SKIP
      notes:
        - the 9-characteristic table is mandatory regardless of whether quality issues are found
        - WARN maps to MEDIUM or below, FAIL maps to HIGH or above

  - id: review-quality-expert-skipped-for-config
    title: Expert review should be skipped for config/chore changes
    prompt: "この設定変更をレビューして"
    context:
      changed_files:
        - config/settings.toml
      change_type: config
      conversation_context: false
    expected:
      primary_skill: km:review
      required_output:
        - severity summary
      expert_review: skipped
      notes:
        - per routing table, config/chore changes skip expert review

  - id: review-quality-expert-skipped-for-test
    title: Expert review should be skipped for test-only changes
    prompt: "テストの変更をレビューして"
    context:
      changed_files:
        - tests/api/users.test.ts
        - tests/lib/auth.test.ts
      change_type: test
      conversation_context: false
    expected:
      primary_skill: km:review
      required_output:
        - severity summary
      expert_review: skipped
      notes:
        - per routing table, test-only changes skip expert review same as config/chore

  - id: review-quality-expert-executed-for-large-fix
    title: Thorough review should execute expert review for large fix changes
    prompt: "深くレビューして"
    context:
      changed_files:
        - src/api/users.ts
        - src/api/auth.ts
        - src/api/routes.ts
        - src/lib/session.ts
        - src/lib/crypto.ts
        - src/lib/validator.ts
        - src/db/queries.ts
        - src/db/migrations.ts
        - src/utils/logger.ts
        - src/utils/parser.ts
        - src/config/settings.ts
      change_type: fix
      conversation_context: true
    expected:
      primary_skill: km:review
      expert_review: executed
      notes:
        - thorough always executes expert review for code changes, including large fix changes

  - id: review-quality-expert-executed-for-small-fix-thorough
    title: Thorough review should execute expert review even for small fix changes
    prompt: "深くレビューして"
    context:
      changed_files:
        - src/api/users.ts
      change_type: fix
      conversation_context: true
    expected:
      primary_skill: km:review
      expert_review: executed
      notes:
        - thorough ignores the old small-fix threshold and still runs expert review

  - id: review-quality-config-standard-quick-depth
    title: Standard review should keep Quick quality-review depth for config changes
    prompt: "この設定変更をレビューして"
    context:
      changed_files:
        - config/settings.toml
      change_type: config
      conversation_context: false
    expected:
      primary_skill: km:review
      required_output:
        - severity summary
      review_depth: Quick
      expert_review: skipped
      notes:
        - level selection should not upgrade config-only quality review beyond Quick depth

  - id: review-quality-docs-only-thorough-skips-quality
    title: Thorough review should not run quality-review for docs-only changes
    prompt: "README を深くレビューして"
    context:
      changed_files:
        - README.md
        - docs/setup.md
      change_type: docs
      conversation_context: false
    expected:
      primary_skill: km:review
      expert_review: skipped
      should_not_output:
        - quality evaluation summary table with 9 characteristics
      notes:
        - docs-only first-pass routing should keep quality-review out even in thorough level

  - id: review-quality-multiple-surfaces-no-unrelated-findings
    title: Multiple surfaces should combine relevant lenses without inventing unrelated ones
    prompt: "レビューして"
    context:
      changed_files:
        - src/api/orders.ts
        - src/ui/orders.tsx
        - src/db/migrations/20260412_add_order_flags.sql
      change_type: feat
      conversation_context: true
    expected:
      primary_skill: km:review
      required_output:
        - quality evaluation summary table with 9 characteristics
      should_not_output:
        - CLI / developer tool
      notes:
        - review should combine HTTP API, Web/Browser, and database/data store lenses
        - unrelated CLI-only findings should not be invented

  - id: review-quality-quick-surface-does-not-force-quality
    title: Quick review should not force quality-review even when API surfaces apply
    prompt: "軽くレビューして"
    context:
      changed_files:
        - src/api/webhook.ts
      change_type: fix
      conversation_context: true
    expected:
      primary_skill: km:review
      should_not_output:
        - quality evaluation summary table with 9 characteristics
      notes:
        - quick keeps the existing minimal path and surfaces must not escalate it back into quality-review

  - id: review-quality-tier2-skip-wins-over-surface
    title: Tier 2 skip conditions should win over surface-conditioned supplements
    prompt: "レビューして"
    context:
      changed_files:
        - src/api/internal/health.ts
      change_type: fix
      conversation_context: true
      public_interface_changed: false
    expected:
      primary_skill: km:review
      required_output:
        - quality evaluation summary table with 9 characteristics
      notes:
        - compatibility should remain SKIP when no public API, CLI, DB schema, or config contract changed
        - HTTP API surface alone must not override Tier 2 skip rules

  - id: review-quality-database-surface-trigger
    title: Database and migration changes should trigger database surface checks
    prompt: "レビューして"
    context:
      changed_files:
        - src/db/migrations/20260412_add_status.sql
        - src/db/queries.ts
      change_type: feat
      conversation_context: true
    expected:
      primary_skill: km:review
      required_output:
        - quality evaluation summary table with 9 characteristics
      notes:
        - database/data store changes should activate compatibility, reliability, performance, and safety lenses

  - id: review-quality-non-ui-change-should-not-report-wcag
    title: Non-UI changes should not trigger WCAG framing
    prompt: "レビューして"
    context:
      changed_files:
        - src/api/orders.ts
        - src/lib/orders.ts
      change_type: feat
      conversation_context: true
    expected:
      primary_skill: km:review
      required_output:
        - quality evaluation summary table with 9 characteristics
      should_not_output:
        - WCAG 2.2
      notes:
        - accessibility framing should not appear when there is no Web/Browser interaction change

  - id: npm-review-no-allow-without-exact-version
    title: npm package review should not allow when exact version is missing
    prompt: "npm パッケージ lodash の採用前セキュリティレビューをして"
    context:
      changed_files: []
      conversation_context: true
    expected:
      primary_skill: km:npm-package-security-review
      should_not_output:
        - final decision ALLOW
      required_output:
        - request for exact version or human review path

  - id: npm-review-no-allow-with-ambiguous-repository
    title: npm package review should not allow when package to repository mapping is ambiguous
    prompt: "npm パッケージ example-pkg@1.2.3 の採用前セキュリティレビューをして"
    context:
      changed_files: []
      conversation_context: true
      injected_issue: "repository mapping is ambiguous"
    expected:
      primary_skill: km:npm-package-security-review
      should_not_output:
        - final decision ALLOW
      required_output:
        - uncertainty or human review section

  - id: npm-review-reject-on-critical-advisory
    title: npm package review should reject unresolved critical advisory
    prompt: "npm パッケージ vulnerable-lib@2.0.0 の採用前セキュリティレビューをして"
    context:
      changed_files: []
      conversation_context: true
      injected_issue: "unresolved critical advisory affects target version"
    expected:
      primary_skill: km:npm-package-security-review
      required_output:
        - final decision
        - evidence summary
      expected_decision: REJECT

  - id: npm-review-report-format-japanese
    title: npm package review output should include Japanese sections, reasons, urls, and absolute dates
    prompt: "npm パッケージ lodash@4.17.21 の採用前セキュリティレビューをして"
    context:
      changed_files: []
      conversation_context: true
    expected:
      primary_skill: km:npm-package-security-review
      required_output:
        - Japanese required sections
        - 2 to 4 decision reasons
        - evidence URLs
        - absolute dates
