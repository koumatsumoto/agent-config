version: 1
scenarios:
  - id: review-routing-code-only
    title: Code-only change with conversation context
    prompt: "レビューして"
    context:
      changed_files:
        - src/api/users.ts
        - src/lib/auth.ts
      change_type: feat
      conversation_context: true
    expected:
      primary_skill: km:review
      child_skills:
        - km:intent-review
        - km:code-review
        - km:quality-review
      child_skills_skipped:
        - km:doc-review
      expert_review: executed
      additional_checks:
        - code-only doc update necessity check is performed

  - id: review-routing-docs-only
    title: Docs-only change should route only to doc-review
    prompt: "README をレビューして"
    context:
      changed_files:
        - README.md
        - docs/setup.md
      change_type: docs
      conversation_context: false
    expected:
      primary_skill: km:review
      child_skills:
        - km:doc-review
      child_skills_skipped:
        - km:intent-review
        - km:code-review
        - km:quality-review
      expert_review: skipped

  - id: review-routing-config-chore
    title: Config or chore only change should use Quick path
    prompt: "この設定変更を確認して"
    context:
      changed_files:
        - templates/config.toml
        - install.sh
      change_type: config
      conversation_context: false
    expected:
      primary_skill: km:review
      child_skills:
        - km:code-review
        - km:quality-review
      child_skills_skipped:
        - km:intent-review
        - km:doc-review
      review_depth: Quick
      expert_review: skipped
      notes:
        - config/chore should not fall through an undefined type

  - id: review-routing-no-conversation-context
    title: Missing conversation context should skip intent-review
    prompt: "この差分をレビューして"
    context:
      changed_files:
        - src/service.ts
      change_type: fix
      conversation_context: false
    expected:
      primary_skill: km:review
      child_skills:
        - km:code-review
        - km:quality-review
      child_skills_skipped:
        - km:intent-review
        - km:doc-review
      expert_review: executed
      additional_checks:
        - code-only doc update necessity check is performed
      notes:
        - output should state a concrete skip reason instead of guessing intent

  - id: review-routing-code-and-docs-self
    title: Code + docs change with conversation context should run all 5 reviews
    prompt: "レビューして"
    context:
      changed_files:
        - src/api/users.ts
        - docs/api.md
      change_type: feat
      conversation_context: true
    expected:
      primary_skill: km:review
      child_skills:
        - km:intent-review
        - km:code-review
        - km:quality-review
        - km:doc-review
      expert_review: executed
      notes:
        - most complex routing path with all 5 review axes active

  - id: review-routing-code-and-docs-third-party
    title: Code + docs change without conversation context should skip intent-review
    prompt: "この差分をレビューして"
    context:
      changed_files:
        - src/api/users.ts
        - docs/api.md
      change_type: feat
      conversation_context: false
    expected:
      primary_skill: km:review
      child_skills:
        - km:code-review
        - km:quality-review
        - km:doc-review
      child_skills_skipped:
        - km:intent-review
      expert_review: executed
