version: 2
scenarios:
  - id: review-routing-code-only-standard
    title: Code-only change at standard level
    prompt: "レビューして"
    context:
      changed_files:
        - src/api/users.ts
        - src/lib/auth.ts
      change_type: feat
      change_composition: code-only
    expected:
      primary_skill: km:review
      target_resolution: uncommitted
      level: standard
      phases:
        phase_2_code_review: executed
        phase_3_experts: []
        phase_4_doc_review: need-check
        phase_5_integration: executed

  - id: review-routing-docs-only
    title: Docs-only change skips Phase 2 and Phase 3, runs Phase 4 full
    prompt: "README をレビューして"
    context:
      changed_files:
        - README.md
        - docs/setup.md
      change_type: docs
      change_composition: docs-only
    expected:
      primary_skill: km:review
      target_resolution: uncommitted
      level: standard
      phases:
        phase_2_code_review: skipped
        phase_3_experts: []
        phase_4_doc_review: full
        phase_5_integration: executed

  - id: review-routing-config-chore
    title: Config or chore only change skips Phase 3 and Phase 4
    prompt: "この設定変更をレビューして"
    context:
      changed_files:
        - templates/config.toml
        - install.sh
      change_type: chore
      change_composition: config
    expected:
      primary_skill: km:review
      target_resolution: uncommitted
      level: standard
      phases:
        phase_2_code_review: executed
        phase_3_experts: []
        phase_4_doc_review: skipped
        phase_5_integration: executed

  - id: review-routing-code-and-docs-thorough
    title: Thorough review on code+docs runs Phase 3 with 3 experts in parallel
    prompt: "深くレビューして"
    context:
      changed_files:
        - src/api/users.ts
        - docs/api.md
      change_type: feat
      change_composition: code+docs
    expected:
      primary_skill: km:review
      target_resolution: uncommitted
      level: thorough
      phases:
        phase_2_code_review: executed
        phase_3_experts: [architect, qa, security]
        phase_4_doc_review: full
        phase_5_integration: executed
      experts_emitted_in_same_turn: true

  - id: review-routing-pr-thorough
    title: PR target with thorough level
    prompt: "PR をレビューして"
    args: "pr:123 thorough"
    context:
      pr_number: 123
      change_type: feat
      change_composition: code+docs
    expected:
      primary_skill: km:review
      target_resolution: pr
      level: thorough
      phases:
        phase_2_code_review: executed
        phase_3_experts: [architect, qa, security]
        phase_4_doc_review: full
        phase_5_integration: executed


  - id: review-routing-ambiguous-numeric
    title: Bare numeric argument is rejected as ambiguous
    prompt: "/km:review 42"
    args: "42"
    expected:
      primary_skill: km:review
      target_resolution: error
      warning: ambiguous_argument

  - id: review-routing-quick-code-only
    title: Quick level on code-only triggers Phase 4 need-check mode
    prompt: "軽くレビューして"
    args: "quick"
    context:
      changed_files:
        - src/service.ts
      change_type: fix
      change_composition: code-only
    expected:
      primary_skill: km:review
      target_resolution: uncommitted
      level: quick
      phases:
        phase_2_code_review: executed
        phase_3_experts: []
        phase_4_doc_review: need-check
        phase_5_integration: executed

  - id: review-routing-repo-thorough
    title: --repo subtree with thorough runs all phases in mixed mode (Phase 4 full)
    prompt: "リポジトリ全体をレビューして"
    args: "--repo src/api thorough"
    context:
      target_subtree: src/api
      change_composition: mixed
    expected:
      primary_skill: km:review
      target_resolution: repo-subtree
      level: thorough
      phases:
        phase_2_code_review: executed
        phase_3_experts: [architect, qa, security]
        phase_4_doc_review: full
        phase_5_integration: executed
      experts_emitted_in_same_turn: true
