#:schema https://developers.openai.com/codex/config-schema.json

# OpenAI Codex CLI base configuration managed by agent-config.
# Copy this file to ~/.codex/config.toml via install.sh.

model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
model_verbosity = "low"
plan_mode_reasoning_effort = "high"
personality = "pragmatic"
# Fully trusted local development baseline. The sandbox stays disabled, so
# routine reads, edits, shell network, and external writes run autonomously.
# Explicit approval requests from rules or tools go to the automatic reviewer;
# the shared guideline and per-repo rules remain the behavioral guard.
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "danger-full-access"
web_search = "live"
check_for_update_on_startup = true
project_doc_fallback_filenames = ["CLAUDE.md"]

[features]
memories = true

[memories]
generate_memories = true
use_memories = true

[tui]
alternate_screen = "never"
show_tooltips = false
animations = false
notifications = ["agent-turn-complete"]
notification_method = "auto"
notification_condition = "unfocused"
status_line = ["model-with-reasoning", "git-branch", "current-dir", "context-used", "five-hour-limit", "used-tokens", "weekly-limit", "branch-changes", "estimated-thread-cost", "task-progress"]
status_line_use_colors = true

[history]
persistence = "save-all"
max_bytes = 50000000
