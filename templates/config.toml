#:schema https://developers.openai.com/codex/config-schema.json

# OpenAI Codex CLI base configuration managed by agent-config.
# Copy this file to ~/.codex/config.toml via install.sh.

model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
model_verbosity = "low"
plan_mode_reasoning_effort = "high"
personality = "pragmatic"
# Fully trusted local development baseline. No sandbox and no approval gate:
# reads, edits, shell network, and external writes all run autonomously.
# Dangerous operations are not contained by config; the shared agent guideline
# deployed as ~/.codex/AGENTS.md (canonical source: templates/CLAUDE.md) and
# per-repo rules carry the behavioral guard instead.
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "cached"
check_for_update_on_startup = true
project_doc_fallback_filenames = ["CLAUDE.md"]

[features]
memories = true

[memories]
generate_memories = true
use_memories = true

[tui]
alternate_screen = "never"
show_tooltips = false
animations = false
status_line = ["model-with-reasoning", "git-branch", "current-dir", "context-used", "five-hour-limit", "used-tokens", "weekly-limit"]

[history]
persistence = "save-all"
max_bytes = 50000000
