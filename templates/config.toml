#:schema https://developers.openai.com/codex/config-schema.json

# OpenAI Codex CLI base configuration managed by agent-config.
# install.sh replaces ~/.codex/config.toml with this template.

personality = "pragmatic"

approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = ":workspace"

web_search = "live"
project_doc_fallback_filenames = ["CLAUDE.md"]

[tui]
alternate_screen = "never"
show_tooltips = false
animations = false
notifications = ["agent-turn-complete"]
status_line = ["model-with-reasoning", "git-branch", "current-dir", "context-used", "five-hour-limit", "used-tokens", "weekly-limit", "branch-changes", "estimated-thread-cost", "task-progress"]

[history]
max_bytes = 50000000
