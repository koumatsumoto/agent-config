#:schema https://developers.openai.com/codex/config-schema.json

# OpenAI Codex CLI base configuration managed by agent-config.
# Copy this file to ~/.codex/config.toml via install.sh.

model = "gpt-5.5"
model_reasoning_effort = "medium"
model_verbosity = "medium"
plan_mode_reasoning_effort = "high"
personality = "pragmatic"
# Autonomous-by-default local development baseline. Routine workspace reads,
# edits, and safe commands run without blocking the agent. Anything that needs
# to leave the workspace sandbox, use shell network, or perform a side-effecting
# app/MCP action is routed through the approval path, where auto_review can deny
# critical risk fail-closed.
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"
web_search = "cached"
check_for_update_on_startup = true
project_doc_fallback_filenames = ["CLAUDE.md"]

[sandbox_workspace_write]
network_access = false

[features]
enable_request_compression = true
fast_mode = false
multi_agent = true
personality = true
shell_snapshot = true
shell_tool = true
skill_mcp_dependency_install = true
unified_exec = true

[tui]
alternate_screen = "never"
show_tooltips = false
animations = false
# Built-in TUI items only. As of codex-cli 0.128.0, the status line does not
# expose a dedicated item for the five-hour limit reset timestamp.
status_line = ["model-with-reasoning", "git-branch", "current-dir", "context-used", "five-hour-limit", "used-tokens", "weekly-limit"]

[history]
persistence = "save-all"
max_bytes = 50000000
