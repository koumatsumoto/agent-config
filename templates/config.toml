#:schema https://developers.openai.com/codex/config-schema.json

# OpenAI Codex CLI base configuration managed by agent-config.
# Copy this file to ~/.codex/config.toml via install.sh.

model = "gpt-5.4"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"
personality = "pragmatic"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"
check_for_update_on_startup = true
project_doc_fallback_filenames = ["CLAUDE.md"]

[features]
enable_request_compression = true
fast_mode = false
multi_agent = true
personality = true
shell_snapshot = true
shell_tool = true
skill_mcp_dependency_install = true

[tui]
alternate_screen = "never"
show_tooltips = false
animations = false
# Built-in TUI items only. As of codex-cli 0.118.0, the status line does not
# expose a dedicated item for the five-hour limit reset timestamp.
status_line = ["model-with-reasoning", "git-branch", "current-dir", "context-used", "five-hour-limit", "used-tokens", "weekly-limit"]

[history]
persistence = "save-all"
max_bytes = 50000000

[profiles.deep]
model_reasoning_effort = "high"

[profiles.research]
model_reasoning_effort = "high"
web_search = "live"

[profiles.review]
approval_policy = "never"
sandbox_mode = "read-only"
model_reasoning_effort = "high"

[profiles.readonly]
approval_policy = "never"
sandbox_mode = "read-only"

[profiles.live_web]
web_search = "live"

[notice.model_migrations]
gpt-5-codex = "gpt-5.4"
