#:schema https://developers.openai.com/codex/config-schema.json

# OpenAI Codex CLI base configuration managed by agent-config.
# Copy this file to ~/.codex/config.toml via install.sh.

model = "gpt-5.5"
model_reasoning_effort = "medium"
model_verbosity = "medium"
plan_mode_reasoning_effort = "high"
personality = "pragmatic"
# Trust-first default for local development on owned repositories.
# This keeps routine file edits inside the workspace sandbox, allows outbound
# network for developer CLIs, and still lets Codex request a one-off sandbox
# bypass for operations the sandbox cannot safely model, such as protected git
# metadata updates in some environments.
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"
check_for_update_on_startup = true
project_doc_fallback_filenames = ["CLAUDE.md"]

[sandbox_workspace_write]
network_access = true

[features]
enable_request_compression = true
fast_mode = false
multi_agent = true
personality = true
shell_snapshot = true
shell_tool = true
skill_mcp_dependency_install = true
unified_exec = true

[tui]
alternate_screen = "never"
show_tooltips = false
animations = false
# Built-in TUI items only. As of codex-cli 0.128.0, the status line does not
# expose a dedicated item for the five-hour limit reset timestamp.
status_line = ["model-with-reasoning", "git-branch", "current-dir", "context-used", "five-hour-limit", "used-tokens", "weekly-limit"]

[history]
persistence = "save-all"
max_bytes = 50000000

[profiles.deep]
model_reasoning_effort = "high"

[profiles.research]
model_reasoning_effort = "high"
web_search = "live"

[profiles.full_trust]
approval_policy = "never"
sandbox_mode = "danger-full-access"

[profiles.autonomous]
approval_policy = "never"
sandbox_mode = "workspace-write"

[profiles.interactive]
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[profiles.review]
approval_policy = "never"
sandbox_mode = "read-only"
model_reasoning_effort = "high"

[profiles.readonly]
approval_policy = "never"
sandbox_mode = "read-only"

[profiles.live_web]
web_search = "live"
