#:schema https://developers.openai.com/codex/config-schema.json

# OpenAI Codex CLI base configuration managed by agent-config.
# Copy this file to ~/.codex/config.toml via install.sh.

model = "gpt-5.4"
model_reasoning_effort = "medium"
personality = "pragmatic"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"
project_doc_fallback_filenames = ["CLAUDE.md"]

[tui]
alternate_screen = "never"
notifications = true
notification_method = "auto"
show_tooltips = false
animations = false
# Built-in TUI items only. As of codex-cli 0.118.0, the status line does not
# expose a dedicated item for the five-hour limit reset timestamp.
status_line = ["model-with-reasoning", "git-branch", "current-dir", "context-used", "five-hour-limit", "used-tokens", "total-input-tokens", "total-output-tokens"]

[history]
persistence = "save-all"
max_bytes = 50000000

[profiles.deep]
model_reasoning_effort = "high"

[profiles.readonly]
approval_policy = "never"
sandbox_mode = "read-only"

[profiles.live_web]
web_search = "live"

[profiles.fast]
service_tier = "fast"
model_reasoning_effort = "medium"

[notice.model_migrations]
gpt-5-codex = "gpt-5.4"
