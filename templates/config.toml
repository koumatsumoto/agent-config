# OpenAI Codex CLI base configuration managed by agent-config.
# Copy/link this file to ~/.codex/config.toml via scripts/install.sh.

# Primary model used by Codex CLI.
model = "gpt-5.4"

# Approval policy:
# - untrusted
# - on-failure
# - on-request
# - never
approval_policy = "on-request"

# Sandbox mode:
# - read-only
# - workspace-write
# - danger-full-access
sandbox_mode = "workspace-write"
model_reasoning_effort = "medium"

[tui]
# Synced from the current interactive /statusline selection.
# Shows model/git/current dir plus context, 5h limit, and token counters.
status_line = ["model-with-reasoning", "git-branch", "current-dir", "model-name", "context-used", "five-hour-limit", "used-tokens", "total-input-tokens", "total-output-tokens"]

[notice.model_migrations]
gpt-5-codex = "gpt-5.4"
