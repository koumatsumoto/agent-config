#:schema https://developers.openai.com/codex/config-schema.json

# OpenAI Codex CLI base configuration managed by agent-config.
# Copy this file to ~/.codex/config.toml via install.sh.

model = "gpt-5.6-sol"
model_reasoning_effort = "high"
model_verbosity = "low"
plan_mode_reasoning_effort = "high"
personality = "pragmatic"
# Fully autonomous local development baseline. Routine workspace reads, edits, and
# safe commands run without blocking the agent. This is paired with workspace
# sandboxing for containment; commands that require network, destructive scope, or
# higher-risk actions should still be handled through explicit allowlists in rules.
approval_policy = "never"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"
web_search = "cached"
check_for_update_on_startup = true
project_doc_fallback_filenames = ["CLAUDE.md"]

[sandbox_workspace_write]
network_access = false

[features]
enable_request_compression = true
fast_mode = false
multi_agent = true
personality = true
shell_snapshot = true
shell_tool = true
skill_mcp_dependency_install = true
unified_exec = true

[tui]
alternate_screen = "never"
show_tooltips = false
animations = false
# Built-in TUI items only. As of codex-cli 0.128.0, the status line does not
# expose a dedicated item for the five-hour limit reset timestamp.
status_line = ["model-with-reasoning", "git-branch", "current-dir", "context-used", "five-hour-limit", "used-tokens", "weekly-limit"]

[history]
persistence = "save-all"
max_bytes = 50000000
