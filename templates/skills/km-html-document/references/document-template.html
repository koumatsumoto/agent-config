<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <!--
    Content Security Policy（meta で有効なディレクティブのみ）。
    - 外部資源は固定版のMermaidだけを許可し、SRIで検証する。
    - connect-srcとdefault-srcで許可外の通信・資源読込を制限し、img-srcは図の画像化に必要なblob:だけを許可する。
    - Mermaidを更新するときは、script要素、CSPのバージョンパス、SRIを同時に変更する。
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src https://cdn.jsdelivr.net/npm/mermaid@11.15.0/ 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src blob:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title><!-- RENDER:TITLE --></title>
  <!-- render helperが document-template.css を <style> へ挿入する -->
  <style>/* BUILD:INLINE document-template.css */</style>
</head>
<body>
  <div class="container">
    <!-- RENDER:CONTENT -->
  </div>

  <!-- Mermaid（UMDオールインワン版をバージョン固定とSRI付きで読み込む。直後に挿入されるdocument-template.jsが初期化と図操作を行う。処理はクライアント内で完結し、外部送信は行わない） -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.15.0/dist/mermaid.min.js" integrity="sha384-yQ4mmBBT+vhTAwjFH0toJXNYJ6O4usWnt6EPIdWwrRvx2V/n5lXuDZQwQFeSFydF" crossorigin="anonymous"></script>
  <!-- render helperが document-template.js を <script> へ挿入する -->
  <script>/* BUILD:INLINE document-template.js */</script>
</body>
</html>
